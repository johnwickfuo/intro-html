<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Crypto Broker - Advanced Cryptocurrency Trading Platform</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Professional cryptocurrency trading platform with binary options, spot trading, futures, investments, and copy trading features.">
    <meta name="keywords" content="cryptocurrency, trading, bitcoin, ethereum, binary options, futures, investment, copy trading">
    <meta name="author" content="Crypto Broker">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Crypto Broker - Advanced Cryptocurrency Trading Platform">
    <meta property="og:description" content="Trade cryptocurrencies with our advanced platform featuring binary options, spot trading, futures, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.com">
    <meta property="og:image" content="https://your-domain.com/assets/images/og-image.png">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Crypto Broker - Advanced Cryptocurrency Trading Platform">
    <meta name="twitter:description" content="Trade cryptocurrencies with our advanced platform featuring binary options, spot trading, futures, and more.">
    <meta name="twitter:image" content="https://your-domain.com/assets/images/twitter-card.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.coingecko.com">
    
    <!-- CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- TradingView Charting Library -->
    <script src="https://unpkg.com/tradingview-charting-library@1.15.0/bundles/charting_library.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #00FF88;
            --secondary-color: #1C2526;
            --accent-color: #00D9FF;
            --danger-color: #FF4757;
            --warning-color: #FFA726;
            --success-color: #00FF88;
            --dark-bg: #0F1419;
            --card-bg: #1A1E23;
            --border-color: #2D3748;
            --text-primary: #FFFFFF;
            --text-secondary: #A0AEC0;
            --text-muted: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--secondary-color) 100%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: var(--dark-bg);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 255, 136, 0.3);
        }

        .trading-chart {
            min-height: 400px;
            background: var(--card-bg);
            border-radius: 12px;
        }

        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
        }

        .navbar {
            background: rgba(26, 30, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .price-up {
            color: var(--success-color);
        }

        .price-down {
            color: var(--danger-color);
        }

        .loading-spinner {
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }

        .slide-enter-active,
        .slide-leave-active {
            transition: transform 0.3s ease;
        }

        .slide-enter-from {
            transform: translateX(-100%);
        }

        .slide-leave-to {
            transform: translateX(100%);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--card-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }
    </style>
</head>
<body class="gradient-bg">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 flex items-center justify-center bg-gray-900 z-50">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <h2 class="text-xl font-semibold text-white">Loading Crypto Broker...</h2>
            <p class="text-gray-400 mt-2">Initializing trading platform</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" style="display: none;">
        <!-- Navigation Bar -->
        <nav class="navbar fixed top-0 left-0 right-0 z-40 px-4 py-3">
            <div class="flex items-center justify-between max-w-7xl mx-auto">
                <div class="flex items-center space-x-4">
                    <button @click="toggleSidebar" class="lg:hidden text-white hover:text-green-400 transition-colors">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-gradient-to-r from-green-400 to-blue-400 rounded-lg flex items-center justify-center">
                            <i class="fas fa-chart-line text-white text-sm"></i>
                        </div>
                        <h1 class="text-xl font-bold text-white">Crypto Broker</h1>
                    </div>
                </div>

                <div class="hidden md:flex items-center space-x-6">
                    <div class="flex items-center space-x-2 text-sm">
                        <span class="text-gray-400">BTC/USDT:</span>
                        <span class="text-green-400 font-semibold">$45,230.50</span>
                        <span class="text-green-400 text-xs">+2.35%</span>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <button class="relative text-gray-400 hover:text-white transition-colors">
                        <i class="fas fa-bell text-lg"></i>
                        <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <img src="https://ui-avatars.com/api/?name=User&background=00D9FF&color=fff" 
                             alt="Profile" class="w-8 h-8 rounded-full">
                        <span class="hidden sm:inline text-white font-medium">User</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="sidebar fixed left-0 top-0 h-full w-64 pt-16 z-30" :class="{ 'open': sidebarOpen }">
            <div class="p-4">
                <nav class="space-y-2">
                    <a href="#dashboard" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-tachometer-alt text-green-400"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#trading" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-chart-line text-blue-400"></i>
                        <span>Trading</span>
                    </a>
                    <a href="#binary" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-coins text-yellow-400"></i>
                        <span>Binary Options</span>
                    </a>
                    <a href="#futures" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-rocket text-purple-400"></i>
                        <span>Futures</span>
                    </a>
                    <a href="#investment" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-piggy-bank text-pink-400"></i>
                        <span>Investment</span>
                    </a>
                    <a href="#copy-trading" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-users text-indigo-400"></i>
                        <span>Copy Trading</span>
                    </a>
                    <a href="#wallet" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-wallet text-orange-400"></i>
                        <span>Wallet</span>
                    </a>
                    <a href="#chat" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-700 transition-colors">
                        <i class="fas fa-comments text-cyan-400"></i>
                        <span>Live Chat</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="lg:ml-64 pt-16 min-h-screen">
            <router-view></router-view>
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2">
            <!-- Toasts will be inserted here dynamically -->
        </div>

        <!-- Modals -->
        <div id="modal-container">
            <!-- Modals will be inserted here dynamically -->
        </div>
    </div>

    <!-- Scripts -->
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4.2.4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios@1.4.0/dist/axios.min.js"></script>
    
    <!-- Chart.js for trading charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <!-- Socket.IO for real-time updates -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- Web3 for wallet connections -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    
    <!-- WalletConnect -->
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>

    <!-- Main Application Script -->
    <script src="/js/app.js"></script>

    <script>
        // Initialize AOS
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });

        // Hide loading screen when page is loaded
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }, 1000);
        });

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(function(err) {
                        console.log('ServiceWorker registration failed');
                    });
            });
        }
    </script>
</body>
</html>
